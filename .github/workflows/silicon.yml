name: silicon-pilot

on: [push, workflow_dispatch]

jobs:
  pilot:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Host info
        run: |
          uname -m
          lscpu | sed -n '1,5p;9,12p'

      - name: Install qemu-user
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user
          qemu-x86_64 --version | head -1

      - name: Run silicon pilot
        run: python3 progtest/silicon_pilot.py

      - name: Show result
        run: cat results/silicon_pilot.json

      - uses: actions/upload-artifact@v4
        with:
          name: silicon_pilot_json
          path: results/silicon_pilot.json
